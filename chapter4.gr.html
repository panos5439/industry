<script>
let selectedScenario = null;

function showPPE(){
  const task = document.getElementById("taskSelect").value;
  const result = document.getElementById("ppeResult");

  result.style.display = "block";

  if(!task){
    result.innerHTML = "Παρακαλώ επίλεξε μία εργασία.";
    return;
  }

  const ppeData = {
    grinding: `
      <strong>Τρόχισμα μετάλλου — Ενδεικτικά ΜΑΠ:</strong>
      <ul class="ppe-list">
        <li>Γυαλιά προστασίας ή προσωπίδα</li>
        <li>Γάντια κατάλληλα για μηχανικούς κινδύνους</li>
        <li>Προστασία ακοής</li>
        <li>Ρουχισμός εργασίας χωρίς χαλαρά μέρη</li>
        <li>Υποδήματα ασφαλείας</li>
      </ul>
    `,
    chemical: `
      <strong>Χειρισμός χημικού — Ενδεικτικά ΜΑΠ:</strong>
      <ul class="ppe-list">
        <li>Γάντια χημικής προστασίας κατάλληλα για το προϊόν</li>
        <li>Γυαλιά κλειστού τύπου ή προσωπίδα</li>
        <li>Ποδιά ή προστατευτική ενδυμασία</li>
        <li>Αναπνευστική προστασία, εφόσον απαιτείται από το SDS</li>
      </ul>
    `,
    forklift: `
      <strong>Εργασία κοντά σε περονοφόρα — Ενδεικτικά ΜΑΠ:</strong>
      <ul class="ppe-list">
        <li>Γιλέκο υψηλής ορατότητας</li>
        <li>Υποδήματα ασφαλείας</li>
        <li>Κράνος, όπου υπάρχει κίνδυνος πρόσκρουσης ή πτώσης αντικειμένων</li>
      </ul>
    `,
    height: `
      <strong>Εργασία σε ύψος — Ενδεικτικά ΜΑΠ:</strong>
      <ul class="ppe-list">
        <li>Κράνος με ιμάντα συγκράτησης</li>
        <li>Σύστημα προστασίας από πτώση, όπου απαιτείται</li>
        <li>Υποδήματα ασφαλείας με αντιολισθητική σόλα</li>
        <li>Κατάλληλος ρουχισμός εργασίας</li>
      </ul>
    `
  };

  result.innerHTML =
    ppeData[task] +
    "<p><strong>Σημείωση:</strong> Η τελική επιλογή ΜΑΠ πρέπει να βασίζεται στην εκτίμηση κινδύνου, στη διαδικασία εργασίας και στις οδηγίες του κατασκευαστή.</p>";
}

function selectScenario(button){
  document.querySelectorAll(".scenario-option").forEach(btn=>{
    btn.classList.remove("selected");
  });

  button.classList.add("selected");
  selectedScenario = button.dataset.type;

  const feedback = document.getElementById("scenarioFeedback");
  feedback.style.display = "none";
  feedback.innerHTML = "";
}

function submitScenario(){
  const feedback = document.getElementById("scenarioFeedback");

  if(!selectedScenario){
    feedback.style.display = "block";
    feedback.className = "feedback highlight";
    feedback.innerHTML =
      "Παρακαλώ επίλεξε μία απάντηση πριν πατήσεις οριστική απάντηση.";
    return;
  }

  feedback.style.display = "block";

  if(selectedScenario === "correct"){
    feedback.className = "feedback success";
    feedback.innerHTML =
      "Σωστά. Φθαρμένα ή ακατάλληλα ΜΑΠ δεν πρέπει να χρησιμοποιούνται. Η εργασία ξεκινά μόνο όταν υπάρχει κατάλληλη προστασία.";
  } else if(selectedScenario === "partial"){
    feedback.className = "feedback highlight";
    feedback.innerHTML =
      "Μερικώς σωστό, αλλά όχι αρκετό. Αν τα γυαλιά είναι χαραγμένα και μειώνουν την ορατότητα, πρέπει να αντικατασταθούν.";
  } else {
    feedback.className = "feedback danger";
    feedback.innerHTML =
      "Λάθος. Η σύντομη διάρκεια εργασίας δεν μειώνει την ανάγκη για κατάλληλα και λειτουργικά ΜΑΠ.";
  }
}

function checkQuiz(){
  const form = document.getElementById("quizForm");
  const result = document.getElementById("quizResult");
  const progressBar = document.getElementById("progressBar");
  const progressBox = document.querySelector(".progress-box");

  let score = 0;
  let answered = 0;

  const total = 4;

  for(let i = 1; i <= total; i++){
    const answer = form.querySelector(`input[name="q${i}"]:checked`);

    if(answer){
      answered++;

      if(answer.value === "1"){
        score++;
      }
    }
  }

  if(answered < total){
    result.style.display = "block";
    result.className = "feedback highlight";
    result.innerHTML =
      "Παρακαλώ απάντησε και στις τέσσερις ερωτήσεις πριν από την υποβολή.";

    progressBar.style.width = "0%";

    if(progressBox){
      progressBox.setAttribute("aria-valuenow","0");
    }

    return;
  }

  const percentage = Math.round((score / total) * 100);

  progressBar.style.width = percentage + "%";

  if(progressBox){
    progressBox.setAttribute("aria-valuenow", String(percentage));
  }

  result.style.display = "block";

  if(score === total){
    result.className = "feedback success";
    result.innerHTML =
      `Άριστα! Πέτυχες ${score}/${total}. Κατανοείς τις βασικές αρχές σωστής επιλογής και χρήσης ΜΑΠ.`;

  } else if(score >= 2){
    result.className = "feedback highlight";
    result.innerHTML =
      `Καλή προσπάθεια. Πέτυχες ${score}/${total}. Ξαναδές τη σωστή επιλογή, τον έλεγχο και τη χρήση ΜΑΠ.`;

  } else {
    result.className = "feedback danger";
    result.innerHTML =
      `Πέτυχες ${score}/${total}. Προτείνεται να επαναλάβεις την ενότητα πριν δοκιμάσεις ξανά.`;
  }
}
</script>
